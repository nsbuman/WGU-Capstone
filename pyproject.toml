[project]
name = "capstone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nsbuman", email = "nicholasbuman94@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pandoc>=2.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
capstone = "capstone:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
